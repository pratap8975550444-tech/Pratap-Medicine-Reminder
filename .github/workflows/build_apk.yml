name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Clean Manifest and Layout
        run: |
          mkdir -p app/src/main/res/layout
          ns=$(python3 -c 'print(bytes.fromhex("687474703a2f2f736368656d61732e616e64726f69642e636f6d2f61706b2f7265732f616e64726f6964").decode())')
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="%s">\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n<application android:allowBackup="true" android:label="Pratap Medicine Reminder" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">\n<activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity>\n<receiver android:name=".ReminderReceiver" android:enabled="true" android:exported="false" />\n</application>\n</manifest>' "$ns" > app/src/main/AndroidManifest.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="%s" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="20dp">\n<EditText android:id="@+id/etMedicineName" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Enter Medicine Name" />\n<TextView android:id="@+id/tvSelectedTime" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="No Time Selected" />\n<Button android:id="@+id/btnPickTime" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Select Time" />\n<Button android:id="@+id/btnSetReminder" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Set Daily Reminder" />\n<ListView android:id="@+id/lvReminders" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />\n</LinearLayout>' "$ns" > app/src/main/res/layout/activity_main.xml
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pratap-Medicine-Reminder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
